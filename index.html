<!doctype html>
<html lang="ja">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f6f7f3"><meta name="description" content="毎日の小さな学びを、確かな積み重ねに。自分のペースで続ける勉強記録アプリ。"><link rel="icon" type="image/svg+xml" href="/src/favicon.svg"><title>Study Note — 学びを、少しずつ。</title><link rel="stylesheet" href="/src/style.css"><script type="module" src="/src/app.js"></script></head>
<body>
<aside class="sidebar"><a class="brand" href="/" aria-label="Study Note ホーム"><span class="brand-mark">s<span>n</span></span><span>Study Note<small>学びを、少しずつ。</small></span></a><div class="nav-label">MY WORKSPACE</div><nav aria-label="メインナビゲーション"><button class="nav-item active" data-view="dashboard"><span>▦</span>ダッシュボード</button><button class="nav-item" data-view="records"><span>▤</span>学習の記録</button><button class="nav-item" data-view="settings"><span>⚙</span>目標と設定</button></nav><div class="sidebar-note"><div class="little-plant">✳</div><p>今日の小さな一歩が、<br>明日の自分をつくる。</p><span>YOUR PACE, YOUR PROGRESS.</span></div><div class="local-badge"><span class="status-dot"></span>このブラウザーに保存<small>ログイン不要のプライベートノート</small></div></aside>
<div class="workspace"><header class="topbar"><span>MY LEARNING SPACE</span><div><span class="today-date" id="header-date"></span><span class="avatar" aria-label="マイノート">Me</span></div></header><main id="main"></main><footer>Study Note <span>ひとつずつ、できる自分へ。</span><span class="footer-right">Made for your everyday learning.</span></footer></div>
<dialog id="record-dialog"><form id="record-form"><div class="modal-heading"><div><span class="eyebrow">LEARNING LOG</span><h2 id="dialog-title">学習を記録する</h2></div><button type="button" class="icon-button" data-close aria-label="閉じる">×</button></div><input type="hidden" name="id"><div class="form-grid"><label>学習日<input type="date" name="date" required></label><label>科目<select name="subject"></select></label></div><label>学習時間（分）<input type="number" name="minutes" min="1" max="1440" step="1" required placeholder="例：30"></label><label>学んだこと・ひとことメモ<textarea name="note" maxlength="500" rows="3" placeholder="今日はどんなことを学びましたか？"></textarea></label><p class="form-error" id="form-error" role="alert"></p><div class="modal-actions"><button type="button" class="button secondary" data-close>キャンセル</button><button class="button primary" type="submit">記録を保存</button></div></form></dialog>
<dialog id="confirm-dialog"><form method="dialog"><h2>この記録を削除しますか？</h2><p class="muted">削除した記録は元に戻せません。</p><div class="modal-actions"><button class="button secondary" value="cancel">キャンセル</button><button class="button danger" value="delete">削除する</button></div></form></dialog><div id="toast" role="status" aria-live="polite"></div>
</body></html>
